<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="60" y1="20" x2="452" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1CD3A2"/>
      <stop offset="0.55" stop-color="#12A98A"/>
      <stop offset="1" stop-color="#086F5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardShade" x1="0" y1="176" x2="0" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EAF3F1"/>
    </linearGradient>
    <linearGradient id="thumb" x1="140" y1="212" x2="372" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F3B33"/>
      <stop offset="1" stop-color="#13564A"/>
    </linearGradient>
    <linearGradient id="badge" x1="320" y1="308" x2="424" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18B98F"/>
      <stop offset="1" stop-color="#0A6B58"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#053a30" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#053a30" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- top gloss -->
  <path d="M0 116 Q0 0 116 0 H396 Q512 0 512 116 V150 Q256 92 0 150 Z" fill="#ffffff" opacity="0.10"/>

  <!-- queue stack behind -->
  <rect x="164" y="118" width="184" height="128" rx="24" fill="#ffffff" opacity="0.22"/>
  <rect x="146" y="146" width="220" height="150" rx="27" fill="#ffffff" opacity="0.4"/>

  <!-- front card -->
  <g filter="url(#cardShadow)">
    <rect x="112" y="176" width="288" height="216" rx="34" fill="url(#cardShade)"/>
  </g>

  <!-- filmstrip sprocket band (top of card) -->
  <rect x="112" y="176" width="288" height="26" rx="0" fill="#0E9C81" opacity="0"/>
  <g fill="#0E9C81" opacity="0.85">
    <rect x="134" y="186" width="16" height="12" rx="3"/>
    <rect x="166" y="186" width="16" height="12" rx="3"/>
    <rect x="198" y="186" width="16" height="12" rx="3"/>
    <rect x="230" y="186" width="16" height="12" rx="3"/>
    <rect x="262" y="186" width="16" height="12" rx="3"/>
    <rect x="294" y="186" width="16" height="12" rx="3"/>
    <rect x="326" y="186" width="16" height="12" rx="3"/>
    <rect x="358" y="186" width="16" height="12" rx="3"/>
  </g>

  <!-- thumbnail screen -->
  <rect x="140" y="214" width="232" height="112" rx="18" fill="url(#thumb)"/>
  <!-- subtle screen highlight -->
  <rect x="140" y="214" width="232" height="52" rx="18" fill="#ffffff" opacity="0.06"/>

  <!-- play button -->
  <circle cx="256" cy="270" r="40" fill="#ffffff" opacity="0.95"/>
  <path d="M244 250 L280 270 L244 290 Z" fill="#0E9C81"/>

  <!-- timeline scrubber -->
  <rect x="140" y="348" width="232" height="10" rx="5" fill="#C9DAD5"/>
  <rect x="140" y="348" width="132" height="10" rx="5" fill="#0E9C81"/>
  <circle cx="272" cy="353" r="11" fill="#ffffff" stroke="#0E9C81" stroke-width="5"/>

  <!-- sent check badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="372" cy="360" r="54" fill="url(#badge)" stroke="#ffffff" stroke-width="12"/>
  </g>
  <path d="M349 361 L366 379 L397 344" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

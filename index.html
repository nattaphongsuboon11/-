<!DOCTYPE html>
<html lang="th">
<head> <link rel="apple-touch-icon" href="icon-detailed.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คิวคลิปรายวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9ECF2;
    --surface:#FFFFFF;
    --ink:#182130;
    --muted:#707C90;
    --line:#DFE4EC;
    --accent:#0FA98C;
    --accent-dark:#0B7E69;
    --sent-bg:#E3F5EF;
    --dot:#CDD4DF;
    --shadow:0 1px 2px rgba(24,33,48,.06),0 8px 24px rgba(24,33,48,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    padding:20px 16px 48px;
    max-width:520px;
    margin:0 auto;
  }
  .head{margin-bottom:20px;}
  .head h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em;}
  .head p{font-size:14px;color:var(--muted);margin:0;}

  /* progress */
  .progress-wrap{background:var(--surface);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow);}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .progress-count{font-size:15px;font-weight:600;}
  .progress-count b{font-size:20px;color:var(--accent-dark);}
  .progress-pct{font-size:13px;color:var(--muted);}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;}
  .grid .cell{aspect-ratio:1;border-radius:6px;background:var(--dot);transition:transform .15s,background .2s;}
  .grid .cell.sent{background:var(--accent);}
  .grid .cell.today{background:var(--surface);border:2px solid var(--accent);}

  /* today card */
  .today-card{
    background:var(--surface);border-radius:20px;padding:24px 20px;margin-bottom:16px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;
    border:1.5px solid var(--accent);
  }
  .today-card::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(15,169,140,.07),transparent 55%);pointer-events:none;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:8px;}
  .today-num{font-size:13px;color:var(--muted);margin-bottom:2px;}
  .today-label{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px;word-break:break-word;}
  .today-sub{font-size:14px;color:var(--muted);margin-bottom:18px;}
  .btn-send{
    width:100%;border:none;background:var(--accent);color:#fff;font-family:inherit;
    font-size:17px;font-weight:700;padding:15px;border-radius:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,background .2s;
  }
  .btn-send:active{transform:scale(.98);background:var(--accent-dark);}
  .btn-send svg{width:20px;height:20px;}

  .all-done{text-align:center;padding:8px 0 4px;}
  .all-done .big{font-size:34px;margin-bottom:6px;}
  .all-done .txt{font-size:17px;font-weight:700;margin-bottom:4px;}
  .all-done .sub{font-size:14px;color:var(--muted);margin-bottom:18px;}
  .btn-new{
    width:100%;border:none;background:var(--ink);color:#fff;font-family:inherit;
    font-size:16px;font-weight:700;padding:14px;border-radius:14px;cursor:pointer;transition:transform .1s;
  }
  .btn-new:active{transform:scale(.98);}

  /* list */
  .list-head{display:flex;justify-content:space-between;align-items:center;margin:24px 4px 10px;}
  .list-head h2{font-size:15px;font-weight:700;margin:0;}
  .list-head .hint{font-size:12px;color:var(--muted);}
  .list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row.is-today{background:linear-gradient(90deg,rgba(15,169,140,.06),transparent);}
  .rownum{width:28px;height:28px;flex:none;border-radius:8px;background:var(--bg);color:var(--muted);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .rownum.sent{background:var(--sent-bg);color:var(--accent-dark);}
  .row input.label{
    flex:1;border:none;background:transparent;font-family:inherit;font-size:15px;color:var(--ink);
    padding:6px 4px;border-radius:8px;min-width:0;
  }
  .row input.label:focus{outline:none;background:var(--bg);}
  .row input.label.sent{color:var(--muted);}
  .toggle{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .15s;}
  .toggle.on{background:var(--accent);border-color:var(--accent);}
  .toggle svg{width:16px;height:16px;color:#fff;opacity:0;transition:opacity .15s;}
  .toggle.on svg{opacity:1;}

  .footer{margin-top:22px;text-align:center;}
  .btn-reset{border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:8px;}

  .loading{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
  <div class="head">
    <h1>คิวคลิปรายวัน</h1>
    <p>ส่งวันละคลิป กันลืม กันซ้ำ — แตะชื่อคลิปเพื่อแก้ไขได้</p>
  </div>

  <div id="app"><div class="loading">กำลังโหลด…</div></div>

  <div class="footer">
    <button class="btn-reset" id="resetBtn" style="display:none">ล้างสถานะทั้งหมด แล้วเริ่มใหม่</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
const TOTAL = 30;
const KEY = 'clipQueue:data:v1';
let state = null;

const checkSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function defaultState(){
  const clips = [];
  for(let i=1;i<=TOTAL;i++) clips.push({id:i,label:'คลิป '+i,sent:false,lastSent:null});
  return {clips,round:1};
}

async function load(){
  try{
    const r = await window.storage.get(KEY);
    state = r && r.value ? JSON.parse(r.value) : defaultState();
  }catch(e){
    state = defaultState();
  }
  render();
}

async function save(){
  try{ await window.storage.set(KEY, JSON.stringify(state)); }
  catch(e){ toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); }
}

function todayIndex(){
  const i = state.clips.findIndex(c=>!c.sent);
  return i; // -1 if all sent
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'),1800);
}

async function markSent(id){
  const c = state.clips.find(x=>x.id===id);
  if(!c) return;
  c.sent = !c.sent;
  c.lastSent = c.sent ? new Date().toISOString() : null;
  await save(); render();
  if(c.sent) toast('บันทึกแล้ว ✓ ไปกดส่งในไลน์ได้เลย');
}

async function setLabel(id,val){
  const c = state.clips.find(x=>x.id===id);
  if(c){ c.label = val.trim() || ('คลิป '+id); await save(); }
}

async function newRound(){
  state.round += 1;
  state.clips.forEach(c=>{c.sent=false;c.lastSent=null;});
  await save(); render();
  toast('เริ่มรอบใหม่แล้ว รอบที่ '+state.round);
}

async function resetAll(){
  if(!confirm('ล้างชื่อและสถานะทั้งหมด กลับไปเป็นคลิป 1–30 ใหม่?')) return;
  state = defaultState(); await save(); render();
  toast('เริ่มใหม่ทั้งหมดแล้ว');
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short'});
}

function render(){
  const app = document.getElementById('app');
  const sentCount = state.clips.filter(c=>c.sent).length;
  const pct = Math.round(sentCount/TOTAL*100);
  const ti = todayIndex();
  document.getElementById('resetBtn').style.display='inline-block';

  // progress grid
  let cells='';
  state.clips.forEach((c,i)=>{
    let cls='cell';
    if(c.sent) cls+=' sent';
    else if(i===ti) cls+=' today';
    cells+=`<div class="${cls}"></div>`;
  });

  // today card
  let todayHTML;
  if(ti===-1){
    todayHTML = `<div class="today-card"><div class="all-done">
      <div class="big">🎉</div>
      <div class="txt">ส่งครบทั้ง 30 คลิปแล้ว!</div>
      <div class="sub">รอบที่ ${state.round} เสร็จสมบูรณ์</div>
      <button class="btn-new" onclick="newRound()">เริ่มรอบใหม่ ตั้งแต่คลิป 1</button>
    </div></div>`;
  }else{
    const c = state.clips[ti];
    todayHTML = `<div class="today-card">
      <div class="eyebrow">คลิปของวันนี้</div>
      <div class="today-num">ลำดับที่ ${c.id} จาก ${TOTAL}</div>
      <div class="today-label">${escapeHTML(c.label)}</div>
      <div class="today-sub">เปิดไลน์ เลือกคลิปนี้ กดส่งเข้ากลุ่ม แล้วกดปุ่มด้านล่าง</div>
      <button class="btn-send" onclick="markSent(${c.id})">${checkSVG.replace('width:16px','')}<span>ส่งแล้ว</span></button>
    </div>`;
  }

  // list
  let rows='';
  state.clips.forEach((c,i)=>{
    const isToday = i===ti;
    rows += `<div class="row ${isToday?'is-today':''}">
      <div class="rownum ${c.sent?'sent':''}">${c.id}</div>
      <input class="label ${c.sent?'sent':''}" value="${escapeAttr(c.label)}"
        onchange="setLabel(${c.id}, this.value)" />
      <button class="toggle ${c.sent?'on':''}" onclick="markSent(${c.id})" aria-label="สลับสถานะส่ง">${checkSVG}</button>
    </div>`;
  });

  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-top">
        <div class="progress-count">ส่งไปแล้ว <b>${sentCount}</b> / ${TOTAL}</div>
        <div class="progress-pct">รอบที่ ${state.round} · ${pct}%</div>
      </div>
      <div class="grid">${cells}</div>
    </div>
    ${todayHTML}
    <div class="list-head">
      <h2>คลิปทั้งหมด</h2>
      <span class="hint">แตะชื่อเพื่อแก้ · แตะช่องขวาเพื่อทำเครื่องหมาย</span>
    </div>
    <div class="list">${rows}</div>
  `;
}

function escapeHTML(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function escapeAttr(s){return s.replace(/"/g,'&quot;').replace(/</g,'&lt;');}

document.getElementById('resetBtn').addEventListener('click',resetAll);
load();
</script>
</body>
</html>
